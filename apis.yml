name: Zinc
description: >-
  Zinc is a UK-founded, Y Combinator and Seedcamp-backed background checking platform that automates
  pre-employment screening for HR and talent teams. It runs criminal record checks across 195
  countries, employment and reference verification, financial and adverse-media screening, right-to-work
  and qualification checks, delivering results in hours rather than weeks with an average three-day
  turnaround. Zinc integrates with major ATS and HRIS platforms (Workday, Greenhouse, Lever,
  SmartRecruiters, HiBob, SAP SuccessFactors and others) and is ISO 27001, SOC 2, Cyber Essentials,
  GDPR and FCRA aligned. This profile was surfaced as a VC portfolio company and enriched from Zinc's
  public web surface; no public developer API or OpenAPI specification is published at this time.
